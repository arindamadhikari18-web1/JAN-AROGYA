name: jan_arogya_app
description: A healthcare management Flutter application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Flutter multi-language support
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Internationalization and language support
  intl: ^0.20.2

  # API calls - AI Chatbot
  http: ^1.2.2

  # Local data storage
  shared_preferences: ^2.5.4

  # Open phone dialer, maps, URLs
  url_launcher: ^6.3.2

  # Get user's current location
  geolocator: ^14.0.2

  # Open device settings / request permissions
  permission_handler: ^12.0.1

  # Medicine notifications
  flutter_local_notifications: ^18.0.1

  # Timezone support for scheduled notifications
  timezone: ^0.9.4

  # Get device timezone
  flutter_timezone: ^4.1.0

  # Pick health report images from Camera and Gallery
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Generate Android app icon
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Generate localization files from ARB files
  generate: true

  # App logo
  assets:
    - assets/icon/app_logo.png
    - assets/images/doctor.png

# Android App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_logo.png"
  min_sdk_android: 21